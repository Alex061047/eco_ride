version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - mongo
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      BASE_URL: http://localhost:8080
      MONGO_URI: mongodb://mongo:27017
    restart: unless-stopped
    networks:
      - ecoride

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecoride

  mongo:
    image: mongo:5.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ecoride

volumes:
  mysql_data:
  mongo_data:

networks:
  ecoride: